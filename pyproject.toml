[project]
name = "medical-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "twilio>=9.12.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
medical-chatbot = "medical_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
